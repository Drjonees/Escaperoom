<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Keypad</title>
<style>
  :root {
    --amber: #c8a24a;
    --red: #d33b3b;
    --green: #3ad17a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0a0a0c radial-gradient(ellipse at 50% 30%, #1c1c22 0%, #050506 70%);
    color: #b9b4a8;
    font-family: "Courier New", ui-monospace, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 28px;
    padding: 12vh 24px 24px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  h1 {
    font-size: 15px;
    letter-spacing: 0.5em;
    font-weight: normal;
    text-transform: uppercase;
    color: #6e6a60;
    margin: 0;
    text-indent: 0.5em;
  }
  #display {
    display: flex;
    gap: 10px;
  }
  .cell {
    width: 32px;
    height: 46px;
    border-bottom: 2px solid #33313a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: var(--amber);
    text-shadow: 0 0 12px rgba(200, 162, 74, 0.55);
    transition: color 0.15s, border-color 0.15s, text-shadow 0.15s;
  }
  .cell.filled { border-color: #5a5040; }
  .cell.active { border-color: var(--amber); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { border-color: #33313a; } }
  #display.wrong .cell {
    color: var(--red);
    border-color: var(--red);
    text-shadow: 0 0 14px rgba(211, 59, 59, 0.8);
  }
  #display.right .cell {
    color: var(--green);
    border-color: var(--green);
    text-shadow: 0 0 16px rgba(58, 209, 122, 0.8);
  }
  #display.wrong { animation: shake 0.45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    15% { transform: translateX(-10px); }
    30% { transform: translateX(9px); }
    45% { transform: translateX(-7px); }
    60% { transform: translateX(5px); }
    80% { transform: translateX(-3px); }
  }
  #ghost {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    border: 0;
    padding: 0;
  }
  #status {
    height: 18px;
    font-size: 13px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: transparent;
  }
  #status.wrong { color: var(--red); }
  #status.right { color: var(--green); }
  #hint {
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #4a4740;
  }
  #hint.hide { visibility: hidden; }
  #clue {
    display: none;
    text-align: center;
  }
  #clue.show { display: block; animation: fade 0.9s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  #clue .code {
    font-size: 62px;
    letter-spacing: 0.18em;
    color: var(--green);
    text-shadow: 0 0 24px rgba(58, 209, 122, 0.7);
    text-indent: 0.18em;
  }
  #next {
    display: none;
    margin-top: 42px;
    padding: 16px 30px;
    border: 1px solid #3a3742;
    border-radius: 6px;
    background: linear-gradient(#17161b, #100f13);
    color: #8d8879;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    box-shadow: inset 0 1px 0 #2a2833, 0 2px 6px rgba(0,0,0,0.6);
  }
  #next.show { display: inline-block; }
  #next:active { background: #26232c; color: var(--amber); }
  body.solved h1, body.solved #display, body.solved #status, body.solved #hint { display: none; }
</style>
</head>
<body>
  <h1 id="prompt">Indtast kode</h1>
  <div id="display"></div>
  <input id="ghost" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <div id="status"></div>
  <div id="hint">Tryk p&aring; sk&aelig;rmen for at &aring;bne tastaturet</div>

  <div id="clue">
    <div class="code"></div>
    <button id="next">Videre til n&aelig;ste opgave</button>
  </div>

<script>
  var STAGES = [
    { answer: "945113986", clue: "1802", mode: "digits", prompt: "Indtast kode" },
    { answer: "krydderier", clue: "0902", mode: "letters", prompt: "Indtast kodeord" }
  ];

  var display = document.getElementById("display");
  var statusLine = document.getElementById("status");
  var promptLine = document.getElementById("prompt");
  var hint = document.getElementById("hint");
  var clue = document.getElementById("clue");
  var clueCode = clue.querySelector(".code");
  var next = document.getElementById("next");
  var ghost = document.getElementById("ghost");

  var index = 0;
  var stage = STAGES[0];
  var cells = [];
  var entered = "";
  var locked = false;

  function start(i) {
    index = i;
    stage = STAGES[i];
    entered = "";
    locked = false;
    cells = [];
    display.innerHTML = "";
    display.className = "";
    statusLine.className = "";
    statusLine.textContent = "";
    clue.className = "";
    next.className = "";
    document.body.className = "";
    promptLine.textContent = stage.prompt;
    ghost.value = "";
    ghost.inputMode = stage.mode === "digits" ? "numeric" : "text";
    for (var n = 0; n < stage.answer.length; n++) {
      var c = document.createElement("div");
      c.className = "cell";
      display.appendChild(c);
      cells.push(c);
    }
    render();
  }

  function render() {
    for (var i = 0; i < cells.length; i++) {
      var ch = entered[i] || "";
      cells[i].textContent = stage.mode === "letters" ? ch.toUpperCase() : ch;
      cells[i].className = ch ? "cell filled" : "cell";
    }
    if (!locked && entered.length < cells.length) {
      cells[entered.length].className = "cell active";
    }
    hint.className = entered.length > 0 || locked ? "hide" : "";
  }

  function check() {
    locked = true;
    render();
    if (entered === stage.answer) {
      display.className = "right";
      statusLine.className = "right";
      statusLine.textContent = "Adgang godkendt";
      ghost.blur();
      setTimeout(function () {
        document.body.className = "solved";
        clueCode.textContent = stage.clue;
        clue.className = "show";
        if (index < STAGES.length - 1) { next.className = "show"; }
      }, 900);
    } else {
      display.className = "wrong";
      statusLine.className = "wrong";
      statusLine.textContent = "Afvist";
      setTimeout(function () {
        entered = "";
        ghost.value = "";
        locked = false;
        display.className = "";
        statusLine.className = "";
        statusLine.textContent = "";
        render();
      }, 900);
    }
  }

  document.addEventListener("click", function (e) {
    if (e.target.id === "next" || locked) { return; }
    ghost.focus();
  });

  ghost.addEventListener("input", function () {
    if (locked) { return; }
    var allowed = stage.mode === "digits" ? /[^0-9]/g : /[^a-zæøå]/g;
    var v = ghost.value.toLowerCase().replace(allowed, "").slice(0, stage.answer.length);
    ghost.value = v;
    entered = v;
    render();
    if (entered.length === stage.answer.length) { check(); }
  });

  next.addEventListener("click", function () {
    start(index + 1);
    ghost.focus();
  });

  start(0);
</script>
</body>
</html>
